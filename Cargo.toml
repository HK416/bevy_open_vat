[package]
name = "bevy_open_vat"
version = "0.20.0"
edition = "2024"
rust-version = "1.97.1"
description = "OpenVAT (Vertex Animation Texture) plugin for Bevy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hk416/bevy_open_vat"
readme = "README.md"
keywords = ["bevy", "gamedev", "animation", "vat", "gpu"]
categories = ["game-development", "rendering", "graphics"]
exclude = [
    "assets/models/*",
    "assets/image.png",
    "examples/*",
    "Cargo.lock",
]

[features]
default = ["exr"]
# OpenVAT exports EXR textures. Disable if your VAT textures use another format.
exr = ["bevy/exr"]

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "bevy_pbr",
    "bevy_log",
]}
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
argh = "0.1"
bevy = { version = "0.20", features = ["exr", "x11", "wayland"] }

[profile.dev.package."*"]
opt-level = 3

# Bevy systems routinely take many parameters and nested query types.
[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
