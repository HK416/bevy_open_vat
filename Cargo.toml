[package]
name = "bevy_open_vat"
version = "0.18.0"
edition = "2024"
description = "OpenVAT (Vertex Animation Texture) plugin for Bevy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hk416/bevy_open_vat"
keywords = ["bevy", "gamedev", "vat", "animation"]

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "3d_bevy_render",
    "bevy_render",
    "bevy_pbr",
]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
argh = "0.1"
bevy = { version = "0.18", features = ["exr", "x11", "wayland"] }

[profile.dev.package."*"]
opt-level = 3
